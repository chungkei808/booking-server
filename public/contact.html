    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body {
            background-image: url('images/web-image.png');
            background-size: cover;

            background-attachment: fixed;

    /* =========================
       頂部導航列設定
       ========================= */

    .navbar {
        background-color: rgba(255, 255, 255, 0.96) !important;
        padding: 12px 0;
    }

    /* 覆寫原本 .container，避免導航列變成卡片 */
    .navbar > .container {
        background-color: transparent;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
        border-radius: 0;
        box-shadow: none;
        display: flex;
        justify-content: center;
    }

    /* 導航選單置中 */
    .navbar-collapse {
        flex-grow: 0;
    }

    .navbar-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    /* 每個導航項目的按鈕效果 */
    .navbar .nav-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 15px;
        color: #2c3e50;
        background-color: rgba(255, 255, 255, 0.75);
        border: 1px solid #d6e4ec;
        border-radius: 7px;
        font-weight: 500;
        text-decoration: none;
        white-space: nowrap;
        transition:
            background-color 0.2s ease,
            color 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    /* 滑鼠移到按鈕時 */
    .navbar .nav-link:hover {
        color: #ffffff;
        background-color: #3498db;
        border-color: #3498db;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(52, 152, 219, 0.30);
    }

    /* 點擊時 */
    .navbar .nav-link:active {
        transform: translateY(0);
        box-shadow: none;
    }

    /* 首頁目前所在按鈕 */
    .navbar .nav-link.active {
        color: #ffffff;
        background-color: #2c3e50;
        border-color: #2c3e50;
        font-weight: bold;
    }

    .navbar .nav-link.active:hover {
        color: #ffffff;
        background-color: #34495e;
        border-color: #34495e;
    }

    @media (max-width: 991.98px) {
        .navbar > .container {
            justify-content: space-between;
        }

        .navbar-collapse {
            width: 100%;
        }

        .navbar-nav {
            padding-top: 12px;
            align-items: stretch;
        }

        .navbar .nav-link {
            width: 100%;
        }
    }


        .container {

/* 右下角浮動按鈕容器 */
.contact-float-container {
  position: fixed;
  right: 24px;
  bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 9999;
}

/* 80px 正方形白色底色按鈕 */
.contact-float-btn {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.contact-float-btn:hover {
  transform: translateY(-4px);
  border-color: #3498db;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
}

.contact-float-btn:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

/* 圖案尺寸 */
.contact-float-btn img {
  width: 60px;
  height: 60px;
  object-fit: contain;
}

/* 手機版適度縮小，避免遮擋主要內容 */
@media (max-width: 768px) {
  .contact-float-container {
    right: 16px;
    bottom: 16px;
    gap: 10px;
  }

  .contact-float-btn {
    width: 64px;
    height: 64px;
    border-radius: 10px;
  }

  .contact-float-btn img {
    width: 42px;
    height: 42px;
  }
}
