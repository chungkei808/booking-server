  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url('images/web-image.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    /* =========================
       頂部導航列設定
       ========================= */

    .navbar {
        background-color: rgba(255, 255, 255, 0.96) !important;
        padding: 12px 0;
    }

    /* 覆寫原本 .container，避免導航列變成卡片 */
    .navbar > .container {
        background-color: transparent;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
        border-radius: 0;
        box-shadow: none;
        display: flex;
        justify-content: center;
    }

    /* 導航選單置中 */
    .navbar-collapse {
        flex-grow: 0;
    }

    .navbar-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    /* 每個導航項目的按鈕效果 */
    .navbar .nav-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 15px;
        color: #2c3e50;
        background-color: rgba(255, 255, 255, 0.75);
        border: 1px solid #d6e4ec;
        border-radius: 7px;
        font-weight: 500;
        text-decoration: none;
        white-space: nowrap;
        transition:
            background-color 0.2s ease,
            color 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    /* 滑鼠移到按鈕時 */
    .navbar .nav-link:hover {
        color: #ffffff;
        background-color: #3498db;
        border-color: #3498db;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(52, 152, 219, 0.30);
    }

    /* 點擊時 */
    .navbar .nav-link:active {
        transform: translateY(0);
        box-shadow: none;
    }

    /* 首頁目前所在按鈕 */
    .navbar .nav-link.active {
        color: #ffffff;
        background-color: #2c3e50;
        border-color: #2c3e50;
        font-weight: bold;
    }

    .navbar .nav-link.active:hover {
        color: #ffffff;
        background-color: #34495e;
        border-color: #34495e;
    }

    @media (max-width: 991.98px) {
        .navbar > .container {
            justify-content: space-between;
        }

        .navbar-collapse {
            width: 100%;
        }

        .navbar-nav {
            padding-top: 12px;
            align-items: stretch;
        }

        .navbar .nav-link {
            width: 100%;
        }
    }


    /* 首頁主要內容區 */
    .home-container {
      max-width: 700px;
      margin: 40px auto;
      padding: 40px;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .home-container h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 3px solid #3498db;
      font-size: 2em;
    }

    .home-container h2 {
      color: #2c3e50;
      font-size: 1.3em;
    }

    /* 首頁六個功能按鈕 */
    .home-button {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.05rem;
      text-decoration: none;
      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .home-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14);
    }

    .home-button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .home-button.btn-outline-primary {
      color: #2c3e50;
      background-color: rgba(255, 255, 255, 0.8);
      border-color: #3498db;
    }

    .home-button.btn-outline-primary:hover {
      color: #ffffff;
      background-color: #3498db;
      border-color: #3498db;
    }

    .home-button.btn-primary {
      background-color: #3498db;
      border-color: #3498db;
    }

    .home-button.btn-primary:hover {
      background-color: #2980b9;
      border-color: #2980b9;
    }

    @media (max-width: 991.98px) {
      .navbar-nav {
        padding-top: 12px;
      }

      .navbar .nav-link {
        justify-content: flex-start;
      }
    }

    @media (max-width: 768px) {
      .home-container {
        margin: 20px 12px;
        padding: 25px 20px;
      }

      .home-container h1 {
        font-size: 1.6em;
      }

      .home-container h2 {
        font-size: 1.15em;
      }

      .home-button {
        min-height: 54px;
      }
    }
  </style>
